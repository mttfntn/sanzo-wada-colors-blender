name: Bug report
description: Something does not work as described in the README
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check the [README](https://github.com/mttfntn/sanzo-wada-colors-blender#using-it) first, including the [known limits](https://github.com/mttfntn/sanzo-wada-colors-blender#known-limits), and whether an issue for the same problem already exists.

  - type: input
    id: blender
    attributes:
      label: Blender version
      description: Help › About Blender. Sanzo Wada Colors supports Blender 5.3 only.
      placeholder: "5.3.0"
    validations:
      required: true

  - type: input
    id: addon
    attributes:
      label: Sanzo Wada Colors version
      description: Edit › Preferences › Get Extensions (or Add-ons) › Sanzo Wada Colors
      placeholder: "1.0.1"
    validations:
      required: true

  - type: dropdown
    id: renderer
    attributes:
      label: Render engine
      options:
        - Cycles
        - EEVEE
        - Octane
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The color or combination number, the node you selected, the button you pressed, and the Auto / Cycles/EEVEE / Octane setting.
      placeholder: |
        1. Open the default material in the Shader Editor
        2. Combination 176, target Octane
        3. Click Add Palette Nodes ...
    validations:
      required: true

  - type: textarea
    id: octane
    attributes:
      label: Octane details (if you use Octane)
      description: OctaneBlender version, and what Preferences › Add-ons › Sanzo Wada Colors › Octane shows ("Octane nodes found").

  - type: textarea
    id: media
    attributes:
      label: Screenshots or a .blend file
      description: Drag images here (a screenshot of the Sanzo Wada panel helps), or a small .blend (zip it to attach it).

  - type: textarea
    id: console
    attributes:
      label: Error messages
      description: Messages in the system console (Window › Toggle System Console on Windows), or any Blender error.
      render: shell
